<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 동화책 생성기</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>AI 동화책 생성기</h1>

    <!-- ── 입력 1: 시대 ── -->
    <div class="screen active" id="screen-era">
      <div class="progress-bar"><span class="progress-fill" style="width:25%"></span></div>
      <p class="progress-label">1 / 4</p>
      <div class="input-group">
        <label for="era">시대를 입력해주세요</label>
        <div class="input-row">
          <input type="text" id="era" placeholder="예: 현대, 옛날, 미래">
          <button class="mic-btn" onclick="startSTT('era')">🎤</button>
        </div>
        <p class="stt-status" id="era-status"></p>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="nextInput()">다음</button>
      </div>
    </div>

    <!-- ── 입력 2: 장소 ── -->
    <div class="screen" id="screen-place">
      <div class="progress-bar"><span class="progress-fill" style="width:50%"></span></div>
      <p class="progress-label">2 / 4</p>
      <div class="input-group">
        <label for="place">배경 장소를 입력해주세요</label>
        <div class="input-row">
          <input type="text" id="place" placeholder="예: 숲속, 바닷가, 우주">
          <button class="mic-btn" onclick="startSTT('place')">🎤</button>
        </div>
        <p class="stt-status" id="place-status"></p>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="prevInput()">이전</button>
        <button class="btn-primary" onclick="nextInput()">다음</button>
      </div>
    </div>

    <!-- ── 입력 3: 등장인물 ── -->
    <div class="screen" id="screen-characters">
      <div class="progress-bar"><span class="progress-fill" style="width:75%"></span></div>
      <p class="progress-label">3 / 4</p>
      <div class="input-group">
        <label for="characters">등장인물을 입력해주세요</label>
        <div class="input-row">
          <input type="text" id="characters" placeholder="예: 토끼와 거북이">
          <button class="mic-btn" onclick="startSTT('characters')">🎤</button>
        </div>
        <p class="stt-status" id="characters-status"></p>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="prevInput()">이전</button>
        <button class="btn-primary" onclick="nextInput()">다음</button>
      </div>
    </div>

    <!-- ── 입력 4: 주제 ── -->
    <div class="screen" id="screen-topic">
      <div class="progress-bar"><span class="progress-fill" style="width:100%"></span></div>
      <p class="progress-label">4 / 4</p>
      <div class="input-group">
        <label for="topic">주제를 입력해주세요</label>
        <div class="input-row">
          <input type="text" id="topic" placeholder="예: 우정, 용기, 나눔">
          <button class="mic-btn" onclick="startSTT('topic')">🎤</button>
        </div>
        <p class="stt-status" id="topic-status"></p>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="prevInput()">이전</button>
        <button class="btn-primary" onclick="startGeneration()">동화 생성 시작!</button>
      </div>
    </div>

    <!-- ── 표지 ── -->
    <div class="screen" id="screen-cover">
      <p class="page-label">표지</p>

      <div class="loading-block" id="cover-loading">
        <div class="spinner"></div>
        <p id="cover-loading-msg">동화 스토리를 생성하는 중...</p>
      </div>

      <div class="story-content" id="cover-content">
        <h2 class="story-title" id="cover-title"></h2>
        <div class="image-wrap">
          <img id="cover-img" class="story-img" alt="표지 이미지">
        </div>
        <audio class="audio-player" id="cover-audio" controls style="display:none"></audio>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="cover-next" onclick="goToScene(1)" disabled>1장 보기</button>
      </div>
    </div>

    <!-- ── 장면 1 ── -->
    <div class="screen" id="screen-scene-1">
      <p class="page-label">1 / 4</p>
      <div class="loading-block" id="scene-loading-1">
        <div class="spinner"></div>
        <p>첫 번째 장면을 준비하는 중...</p>
      </div>
      <div class="story-content" id="scene-content-1">
        <span class="emotion-badge" id="scene-emotion-1"></span>
        <h3 class="scene-title" id="scene-title-1"></h3>
        <p class="narration" id="scene-narration-1"></p>
        <p class="dialogue" id="scene-dialogue-1"></p>
        <div class="panels">
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-1-1"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-1-1" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-1-2"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-1-2" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-1-3"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-1-3" alt="" style="display:none">
          </div>
        </div>
        <audio class="audio-player" id="scene-audio-1" controls></audio>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="goToCover()">이전</button>
        <button class="btn-primary" id="scene-next-1" onclick="goToScene(2)" disabled>다음 장면</button>
      </div>
    </div>

    <!-- ── 장면 2 ── -->
    <div class="screen" id="screen-scene-2">
      <p class="page-label">2 / 4</p>
      <div class="loading-block" id="scene-loading-2">
        <div class="spinner"></div>
        <p>두 번째 장면을 준비하는 중...</p>
      </div>
      <div class="story-content" id="scene-content-2">
        <span class="emotion-badge" id="scene-emotion-2"></span>
        <h3 class="scene-title" id="scene-title-2"></h3>
        <p class="narration" id="scene-narration-2"></p>
        <p class="dialogue" id="scene-dialogue-2"></p>
        <div class="panels">
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-2-1"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-2-1" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-2-2"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-2-2" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-2-3"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-2-3" alt="" style="display:none">
          </div>
        </div>
        <audio class="audio-player" id="scene-audio-2" controls></audio>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="goToScene(1)">이전</button>
        <button class="btn-primary" id="scene-next-2" onclick="goToScene(3)" disabled>다음 장면</button>
      </div>
    </div>

    <!-- ── 장면 3 ── -->
    <div class="screen" id="screen-scene-3">
      <p class="page-label">3 / 4</p>
      <div class="loading-block" id="scene-loading-3">
        <div class="spinner"></div>
        <p>세 번째 장면을 준비하는 중...</p>
      </div>
      <div class="story-content" id="scene-content-3">
        <span class="emotion-badge" id="scene-emotion-3"></span>
        <h3 class="scene-title" id="scene-title-3"></h3>
        <p class="narration" id="scene-narration-3"></p>
        <p class="dialogue" id="scene-dialogue-3"></p>
        <div class="panels">
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-3-1"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-3-1" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-3-2"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-3-2" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-3-3"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-3-3" alt="" style="display:none">
          </div>
        </div>
        <audio class="audio-player" id="scene-audio-3" controls></audio>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="goToScene(2)">이전</button>
        <button class="btn-primary" id="scene-next-3" onclick="goToScene(4)" disabled>다음 장면</button>
      </div>
    </div>

    <!-- ── 장면 4 (마지막) ── -->
    <div class="screen" id="screen-scene-4">
      <p class="page-label">4 / 4 &mdash; 마지막 장면</p>
      <div class="loading-block" id="scene-loading-4">
        <div class="spinner"></div>
        <p>마지막 장면을 준비하는 중...</p>
      </div>
      <div class="story-content" id="scene-content-4">
        <span class="emotion-badge" id="scene-emotion-4"></span>
        <h3 class="scene-title" id="scene-title-4"></h3>
        <p class="narration" id="scene-narration-4"></p>
        <p class="dialogue" id="scene-dialogue-4"></p>
        <div class="panels">
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-4-1"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-4-1" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-4-2"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-4-2" alt="" style="display:none">
          </div>
          <div class="panel">
            <div class="panel-spinner" id="panel-spinner-4-3"><div class="mini-spinner"></div></div>
            <img class="panel-img" id="panel-img-4-3" alt="" style="display:none">
          </div>
        </div>
        <audio class="audio-player" id="scene-audio-4" controls></audio>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="goToScene(3)">이전</button>
        <button class="btn-primary" onclick="reset()">처음으로</button>
      </div>
    </div>

  </div><!-- .container -->
  <script src="/static/app.js"></script>
</body>
</html>
