<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 동화책 생성</title>
  <link rel="stylesheet" href="/static/style.css?v=api-20260512b">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">AI Story Generator</p>
        <h1>AI 동화책 생성</h1>
      </div>
      <span class="connection-pill" id="connection-status">대기</span>
    </header>

    <main class="workspace">
      <section class="input-panel" aria-labelledby="form-title">
        <div class="section-heading">
          <p class="eyebrow">입력</p>
          <h2 id="form-title">기본 작업 내용</h2>
        </div>

        <form id="story-form" class="story-form">
          <div class="field-grid">
            <label class="field-control" for="era">
              <span>시대</span>
              <div class="field-row">
                <input id="era" name="era_ko" type="text" autocomplete="off" placeholder="조선 시대, 먼 미래, 오늘 밤">
                <button class="voice-button" type="button" data-field="era" aria-label="시대 음성 입력">녹음</button>
              </div>
              <small id="era-status"></small>
            </label>

            <label class="field-control" for="place">
              <span>장소</span>
              <div class="field-row">
                <input id="place" name="place_ko" type="text" autocomplete="off" placeholder="숲속 마을, 달빛 항구, 우주 정거장">
                <button class="voice-button" type="button" data-field="place" aria-label="장소 음성 입력">녹음</button>
              </div>
              <small id="place-status"></small>
            </label>

            <label class="field-control" for="characters">
              <span>등장인물</span>
              <div class="field-row">
                <input id="characters" name="characters_ko" type="text" autocomplete="off" placeholder="겁 많은 아이와 말하는 나침반">
                <button class="voice-button" type="button" data-field="characters" aria-label="등장인물 음성 입력">녹음</button>
              </div>
              <small id="characters-status"></small>
            </label>

            <label class="field-control" for="topic">
              <span>주제</span>
              <div class="field-row">
                <input id="topic" name="topic_ko" type="text" autocomplete="off" placeholder="우정, 용기, 약속을 지키는 마음">
                <button class="voice-button" type="button" data-field="topic" aria-label="주제 음성 입력">녹음</button>
              </div>
              <small id="topic-status"></small>
            </label>
          </div>

          <div class="form-actions">
            <button class="primary-action" id="start-button" type="submit">생성 시작</button>
            <button class="secondary-action" id="reset-button" type="button">초기화</button>
          </div>
          <p class="form-message" id="form-message" role="alert"></p>
        </form>
      </section>

      <section class="run-panel" id="run-panel" aria-live="polite" hidden>
        <div class="status-band">
          <div class="status-copy">
            <p class="eyebrow">실시간 작업</p>
            <h2 id="run-title">작업 준비 중</h2>
            <p id="run-subtitle">요청을 보내면 생성된 결과가 도착하는 순서대로 표시됩니다.</p>
          </div>
          <div class="progress-meter" aria-label="작업 진행률">
            <strong id="progress-percent">0%</strong>
            <span id="progress-label">대기</span>
          </div>
        </div>

        <div class="progress-track">
          <span class="progress-fill" id="progress-fill"></span>
        </div>

        <ol class="pipeline" aria-label="작업 단계">
          <li data-step="story">
            <span>이야기</span>
            <strong id="story-count">0/5</strong>
          </li>
          <li data-step="audio">
            <span>음성</span>
            <strong id="audio-count">0/5</strong>
          </li>
          <li data-step="image">
            <span>이미지</span>
            <strong id="image-count">0/9</strong>
          </li>
          <li data-step="done">
            <span>완료</span>
            <strong id="done-count">대기</strong>
          </li>
        </ol>

        <div class="event-strip">
          <span>최근 이벤트</span>
          <ul id="event-log"></ul>
        </div>

        <section class="cover-section" aria-labelledby="cover-heading">
          <div class="section-heading">
            <p class="eyebrow">표지</p>
            <h2 id="cover-heading">표지 생성 중</h2>
          </div>
          <div class="cover-layout">
            <div class="media-slot cover-slot" id="cover-image-slot">
              <div class="slot-placeholder">
                <span class="loader"></span>
                <p>표지 이미지 대기</p>
              </div>
              <img id="cover-image" alt="생성된 동화책 표지" hidden>
            </div>
            <div class="cover-detail">
              <p id="cover-title" class="cover-title placeholder-line">이야기 제목 대기</p>
              <div class="audio-shell" id="cover-audio-shell">
                <span>표지 음성</span>
                <audio id="cover-audio" controls hidden></audio>
                <small id="cover-audio-status">생성 대기</small>
              </div>
            </div>
          </div>
        </section>

        <section class="scenes-section" aria-labelledby="scenes-heading">
          <div class="section-heading">
            <p class="eyebrow">장면</p>
            <h2 id="scenes-heading">4개 장면</h2>
          </div>
          <div class="scenes-grid" id="scenes-grid"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="/static/app.js?v=api-20260512b" defer></script>
</body>
</html>
